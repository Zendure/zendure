[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "zendure"
version = "0.2.0"
description = "Async local-network client for Zendure energy devices over the zenSDK HTTP protocol (no cloud, no app token)."
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zendure DE GmbH" }]
keywords = ["zendure", "solarflow", "energy", "zensdk", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
# Published metadata keeps a compatibility RANGE so the library can be resolved
# alongside Home Assistant Core (which pins aiohttp==3.14.3). Exact versions are
# pinned only in the dev lockfile, never here.
dependencies = [
  "aiohttp>=3.9",
  "bleak>=3.0",
  "yarl>=1.25.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Zendure/zendure"
Issues = "https://github.com/Zendure/zendure/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zendure"]

# Explicit allowlist: hatch would otherwise pack every non-ignored file in the
# working tree into the sdist.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "LOG", "PT"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["zendure"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=zendure --cov-report=term-missing"
